<div class="preferences-page">
  <div class="preferences-shell">
    <header class="iact-student-header">
      <p class="iact-student-eyebrow">Thông báo</p>
      <h1 class="iact-student-title">Cài đặt thông báo</h1>
      <p class="iact-student-subtitle">
        Chọn các loại thông báo sinh viên muốn nhận từ hệ thống iAct CTU.
      </p>
    </header>

    <section class="notification-panel" aria-labelledby="notification-settings-title">
      <div class="panel-heading">
        <div>
          <h2 id="notification-settings-title">Tùy chọn nhận thông báo</h2>
          <p>Áp dụng cho thông báo trong hệ thống và các kênh đồng bộ sau này.</p>
        </div>
        @if (isLoading()) {
          <span class="status-pill">Đang tải</span>
        }
      </div>

      <div class="settings-list" [class.is-loading]="isLoading()">
        <label class="setting-row">
          <span class="setting-copy">
            <span class="setting-title">Hoạt động mới và cập nhật</span>
            <span class="setting-description"
              >Nhận thông báo khi có hoạt động mới hoặc thay đổi quan trọng.</span
            >
          </span>
          <input
            type="checkbox"
            [checked]="notificationSettings().newActivityAlert"
            [disabled]="isLoading() || isSaving()"
            (change)="updateNotif('newActivityAlert', $event)"
          />
        </label>

        <label class="setting-row">
          <span class="setting-copy">
            <span class="setting-title">Nhắc lịch hoạt động</span>
            <span class="setting-description"
              >Nhận nhắc nhở trước thời gian diễn ra hoạt động.</span
            >
          </span>
          <input
            type="checkbox"
            [checked]="notificationSettings().reminderAlert"
            [disabled]="isLoading() || isSaving()"
            (change)="updateNotif('reminderAlert', $event)"
          />
        </label>

        <label class="setting-row setting-row--input">
          <span class="setting-copy">
            <span class="setting-title">Số ngày nhắc trước</span>
            <span class="setting-description">Mặc định nhắc trước 1 ngày.</span>
          </span>
          <input
            type="number"
            min="1"
            max="14"
            step="1"
            inputmode="numeric"
            [value]="notificationSettings().reminderDaysBefore"
            [disabled]="isLoading() || isSaving() || !notificationSettings().reminderAlert"
            (input)="updateReminderDays($event)"
          />
        </label>
      </div>
    </section>

    <div class="preferences-actions">
      <button
        type="button"
        class="secondary-action"
        (click)="resetNotificationDefaults()"
        [disabled]="isLoading() || isSaving()"
      >
        Khôi phục mặc định
      </button>
      <button
        type="button"
        class="primary-action"
        (click)="savePreferences()"
        [disabled]="isLoading() || isSaving()"
      >
        @if (isSaving()) {
          <span class="spinner" aria-hidden="true"></span>
          <span>Đang lưu...</span>
        } @else {
          <i class="bi bi-check2" aria-hidden="true"></i>
          <span>Lưu thay đổi</span>
        }
      </button>
    </div>
  </div>
</div>
