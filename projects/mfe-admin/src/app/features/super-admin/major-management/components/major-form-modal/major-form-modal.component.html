@if (isOpen) {
  <div class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="major-form-title">
    <form class="modal-form" (ngSubmit)="onSubmit()">
      <div class="modal-form-header">
        <div>
          <h2 id="major-form-title" class="modal-form-title">
            {{ editingMajor ? 'Cập nhật chuyên ngành' : 'Thêm chuyên ngành mới' }}
          </h2>
          <p class="modal-form-desc">
            Thiết lập chuyên ngành trực thuộc đơn vị và hệ đào tạo tương ứng.
          </p>
        </div>
        <button type="button" class="modal-close-btn" (click)="modalClosed.emit()">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <div class="modal-form-grid">
        <div class="form-group">
          <label for="majorName" class="form-label">Tên chuyên ngành</label>
          <input
            id="majorName"
            type="text"
            class="form-input"
            required
            [ngModel]="form.name"
            name="name"
            (ngModelChange)="onNameChange($event)"
          />
        </div>

        <div class="form-group">
          <label for="majorCode" class="form-label">Mã chuyên ngành</label>
          <input
            id="majorCode"
            type="text"
            class="form-input form-input-uppercase"
            required
            [ngModel]="form.code"
            name="code"
            (ngModelChange)="onCodeChange($event)"
          />
        </div>

        <div class="form-group">
          <lib-custom-select
            label="Đơn vị quản lý"
            placeholder="Chọn đơn vị quản lý"
            icon="bi-building"
            [options]="getDepartmentOptions()"
            [value]="form.departmentId === '' ? null : form.departmentId"
            (valueChange)="onDepartmentChange($event)"
          ></lib-custom-select>
        </div>

        <div class="form-group">
          <lib-custom-select
            label="Hệ đào tạo"
            placeholder="Chọn hệ đào tạo"
            icon="bi-mortarboard"
            [options]="getProgramOptions()"
            [value]="form.programType || null"
            (valueChange)="onProgramChange($event)"
          ></lib-custom-select>
        </div>

        <div class="form-group">
          <lib-custom-select
            label="Trạng thái"
            placeholder="Chọn trạng thái"
            icon="bi-check-circle"
            [options]="getActiveOptions()"
            [value]="form.isActive"
            (valueChange)="onActiveChange($event)"
          ></lib-custom-select>
        </div>
      </div>

      <div class="modal-form-actions">
        <button type="button" class="modal-btn-cancel" (click)="modalClosed.emit()">Hủy</button>
        <button type="submit" class="modal-btn-save" [disabled]="isSaving">
          {{ isSaving ? 'Đang lưu...' : 'Lưu chuyên ngành' }}
        </button>
      </div>
    </form>
  </div>
}
