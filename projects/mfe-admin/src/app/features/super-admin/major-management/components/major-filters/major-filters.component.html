<section class="major-filter-bar">
  <div class="filter-count-strip">
    <span class="filter-count-chip"><strong>{{ getTotalCount() }}</strong> tổng</span>
    <span class="filter-count-chip filter-count-chip-success">
      <strong>{{ getStatusCount('true') }}</strong> hoạt động
    </span>
    <span class="filter-count-chip"><strong>{{ getStatusCount('false') }}</strong> tạm ngưng</span>
    <span class="filter-count-chip"><strong>{{ departments.length }}</strong> đơn vị</span>
  </div>

  <div class="major-filter-grid">
    <div class="filter-search-wrap">
      <label for="majorKeyword" class="filter-label">Tìm kiếm</label>
      <div class="filter-input-wrap">
        <i class="bi bi-search filter-icon"></i>
        <input
          id="majorKeyword"
          type="text"
          class="filter-input"
          placeholder="Nhập tên, mã hoặc hệ đào tạo"
          [ngModel]="filters.keyword"
          (ngModelChange)="onKeywordChange($event)"
          (keyup.enter)="applyFilters.emit()"
        />
      </div>
    </div>

    <div class="filter-select-wrap">
      <lib-custom-select
        label="Đơn vị"
        placeholder="Tất cả đơn vị"
        icon="bi-building"
        [options]="getDepartmentOptions()"
        [value]="filters.departmentId"
        (valueChange)="onDepartmentChange($event)"
      ></lib-custom-select>
    </div>

    <div class="filter-select-wrap">
      <lib-custom-select
        label="Trạng thái"
        placeholder="Tất cả"
        icon="bi-ui-checks-grid"
        [options]="getStatusOptions()"
        [value]="filters.active"
        (valueChange)="onStatusChange($event)"
      ></lib-custom-select>
    </div>

    <div class="filter-select-wrap">
      <lib-custom-select
        label="Hệ đào tạo"
        placeholder="Tất cả hệ đào tạo"
        icon="bi-mortarboard"
        [options]="getProgramOptions()"
        [value]="filters.programType"
        (valueChange)="onProgramChange($event)"
      ></lib-custom-select>
    </div>

    <div class="filter-actions">
      <button type="button" class="filter-btn-reset" (click)="resetFilters.emit()">Đặt lại</button>
      <button type="button" class="filter-btn-primary" (click)="applyFilters.emit()">
        Tìm kiếm
      </button>
    </div>
  </div>
</section>
