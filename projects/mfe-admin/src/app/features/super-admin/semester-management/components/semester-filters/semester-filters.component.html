<section class="semester-filter-panel">
  <div class="filter-count-strip">
    <span class="filter-count-chip"><strong>{{ getTotalCount() }}</strong> tổng</span>
    <span class="filter-count-chip filter-count-chip-primary">
      <strong>{{ getActiveSemesterName() }}</strong> hiện hành
    </span>
    <span class="filter-count-chip"><strong>{{ getLockedCount() }}</strong> đã khóa</span>
    <span class="filter-count-chip filter-count-chip-success">
      <strong>{{ getOpenCount() }}</strong> còn mở
    </span>
  </div>

  <div class="semester-filter-grid">
    <div class="filter-group filter-group-search">
      <label for="semesterAcademicYear" class="filter-label">Năm học</label>
      <input
        id="semesterAcademicYear"
        type="text"
        class="filter-input"
        placeholder="2025-2026"
        [ngModel]="filters.academicYear"
        (ngModelChange)="academicYearChange.emit($event)"
        (keyup.enter)="applyFilters.emit()"
      />
    </div>

    <div class="filter-group">
      <lib-custom-select
        label="Áp dụng"
        placeholder="Tất cả"
        icon="bi-ui-checks-grid"
        [options]="getActiveOptions()"
        [value]="filters.active"
        (valueChange)="onActiveChange($event)"
      ></lib-custom-select>
    </div>

    <div class="filter-group">
      <lib-custom-select
        label="Khóa dữ liệu"
        placeholder="Tất cả"
        icon="bi-shield-check"
        [options]="getLockedOptions()"
        [value]="filters.locked"
        (valueChange)="onLockedChange($event)"
      ></lib-custom-select>
    </div>

    <div class="semester-filter-actions">
      <button type="button" class="filter-btn-reset" (click)="resetFilters.emit()">Đặt lại</button>
      <button type="button" class="filter-btn-primary" (click)="applyFilters.emit()">Tìm kiếm</button>
    </div>
  </div>
</section>
