<form
  class="moderation-filters"
  aria-label="Bộ lọc hoạt động"
  (submit)="$event.preventDefault(); applyFilters()"
>
  <div class="moderation-filters__field moderation-filters__field--search">
    <label class="moderation-filters__label" for="keyword-input">Tìm kiếm</label>
    <div class="search-input">
      <i class="bi bi-search search-input__icon"></i>
      <input
        id="keyword-input"
        type="text"
        autocomplete="off"
        [value]="keyword()"
        (input)="onKeywordChange($event)"
        (keyup.enter)="applyFilters()"
        class="search-input__control"
        placeholder="Nhập tên hoạt động..."
      />
      @if (keyword()) {
        <button type="button" class="search-input__clear" (click)="clearKeyword()" aria-label="Xóa tìm kiếm">
          <i class="bi bi-x-lg"></i>
        </button>
      }
    </div>
  </div>

  <div class="moderation-filters__field">
    <lib-custom-select
      label="Khoa / Đơn vị"
      icon="bi-buildings"
      [options]="departmentOptions()"
      [value]="selectedDepartment()"
      (valueChange)="onDepartmentChange($event)"
    ></lib-custom-select>
  </div>

  <div class="moderation-filters__field">
    <lib-custom-select
      label="Trạng thái"
      icon="bi-ui-radios"
      [options]="statusOptions"
      [value]="selectedStatus()"
      (valueChange)="onStatusChange($event)"
    ></lib-custom-select>
  </div>

  <div class="moderation-filters__actions">
    <button type="submit" class="apply-button">
      <i class="bi bi-funnel-fill"></i>
      <span>Áp dụng</span>
    </button>
  </div>
</form>
