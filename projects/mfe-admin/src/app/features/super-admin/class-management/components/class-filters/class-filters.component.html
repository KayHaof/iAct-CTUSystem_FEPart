<section class="class-filter-bar">
  <div class="filter-count-strip">
    <span class="filter-count-chip"><strong>{{ getTotalCount() }}</strong> tổng</span>
    <span class="filter-count-chip filter-count-chip-success">
      <strong>{{ getStatusCount('true') }}</strong> hoạt động
    </span>
    <span class="filter-count-chip"><strong>{{ getStatusCount('false') }}</strong> tạm ngưng</span>
    <span class="filter-count-chip"><strong>{{ getDepartmentWithClassCount() }}</strong> đơn vị có lớp</span>
  </div>

  <div class="class-filter-grid">
    <div class="filter-search-wrap">
      <label for="classKeyword" class="filter-label">Tìm kiếm lớp</label>
      <div class="filter-input-wrap">
        <i class="bi bi-search filter-icon"></i>
        <input
          id="classKeyword"
          type="text"
          class="filter-input"
          placeholder="Nhập tên lớp hoặc mã lớp"
          [ngModel]="filters.keyword"
          (ngModelChange)="keywordChange.emit($event)"
          (keyup.enter)="applyFilters.emit()"
        />
      </div>
    </div>

    <div class="filter-select-wrap">
      <lib-custom-select
        label="Đơn vị"
        placeholder="Tất cả đơn vị"
        icon="bi-building"
        [options]="getDepartmentOptions()"
        [value]="filters.departmentId"
        (valueChange)="onDepartmentChange($event)"
      ></lib-custom-select>
    </div>

    <div class="filter-select-wrap">
      <lib-custom-select
        label="Chuyên ngành"
        placeholder="Tất cả chuyên ngành"
        icon="bi-mortarboard"
        [options]="getMajorOptions()"
        [value]="filters.majorId"
        (valueChange)="onMajorChange($event)"
      ></lib-custom-select>
    </div>

    <div class="filter-select-wrap">
      <lib-custom-select
        label="Khóa tuyển sinh"
        placeholder="Tất cả khóa"
        icon="bi-calendar3"
        [options]="getAcademicYearOptions()"
        [value]="filters.academicYear"
        (valueChange)="onAcademicYearChange($event)"
      ></lib-custom-select>
    </div>

    <div class="filter-select-wrap">
      <lib-custom-select
        label="Trạng thái"
        placeholder="Tất cả"
        icon="bi-ui-checks-grid"
        [options]="getStatusOptions()"
        [value]="filters.active"
        (valueChange)="onStatusChange($event)"
      ></lib-custom-select>
    </div>

    <div class="filter-actions">
      <button type="button" class="filter-btn-reset" (click)="resetFilters.emit()">Đặt lại</button>
      <button type="button" class="filter-btn-primary" (click)="applyFilters.emit()">Tìm kiếm</button>
    </div>
  </div>
</section>
