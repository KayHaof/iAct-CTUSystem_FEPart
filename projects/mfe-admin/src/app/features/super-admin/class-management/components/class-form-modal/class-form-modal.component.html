@if (isOpen) {
  <div class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="class-form-title">
    <form class="modal-form" (ngSubmit)="save.emit()">
      <div class="modal-form-header">
        <div>
          <h2 id="class-form-title" class="modal-form-title">
            {{ editingClass ? 'Cập nhật lớp sinh hoạt' : 'Thêm lớp sinh hoạt mới' }}
          </h2>
          <p class="modal-form-desc">
            Thiết lập lớp thuộc chuyên ngành và khóa tuyển sinh tương ứng.
          </p>
        </div>
        <button type="button" class="modal-close-btn" (click)="modalClosed.emit()">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <div class="modal-form-grid">
        <div class="form-group">
          <label for="className" class="form-label">Tên lớp</label>
          <input
            id="className"
            type="text"
            class="form-input"
            required
            placeholder="Ví dụ: KSTN2022-A"
            [ngModel]="form.name"
            name="name"
            (ngModelChange)="nameChange.emit($event)"
          />
        </div>

        <div class="form-group">
          <label for="classCode" class="form-label">Mã lớp</label>
          <input
            id="classCode"
            type="text"
            class="form-input form-input-uppercase"
            required
            placeholder="Ví dụ: KSTN2022A"
            [ngModel]="form.classCode"
            name="classCode"
            (ngModelChange)="classCodeChange.emit($event)"
          />
        </div>

        <div class="form-group">
          <lib-custom-select
            label="Đơn vị quản lý"
            placeholder="Chọn đơn vị quản lý"
            icon="bi-building"
            [options]="getDepartmentOptions()"
            [value]="form.departmentId === '' ? null : form.departmentId"
            (valueChange)="onDepartmentChange($event)"
          ></lib-custom-select>
        </div>

        <div class="form-group">
          <lib-custom-select
            label="Chuyên ngành"
            placeholder="Chọn chuyên ngành"
            icon="bi-mortarboard"
            [options]="getMajorOptions()"
            [value]="form.majorId === '' ? null : form.majorId"
            (valueChange)="onMajorChange($event)"
          ></lib-custom-select>
        </div>

        <div class="form-group">
          <lib-custom-select
            label="Khóa tuyển sinh"
            placeholder="Chọn khóa tuyển sinh"
            icon="bi-calendar3"
            [options]="getAcademicYearOptions()"
            [value]="form.academicYear || null"
            (valueChange)="onAcademicYearChange($event)"
          ></lib-custom-select>
        </div>

        <div class="form-group">
          <lib-custom-select
            label="Trạng thái"
            placeholder="Chọn trạng thái"
            icon="bi-ui-checks-grid"
            [options]="getActiveOptions()"
            [value]="form.isActive"
            (valueChange)="onActiveChange($event)"
          ></lib-custom-select>
        </div>
      </div>

      <div class="modal-form-actions">
        <button type="button" class="modal-btn-cancel" (click)="modalClosed.emit()">Hủy</button>
        <button type="submit" class="modal-btn-save" [disabled]="isSaving">
          {{ isSaving ? 'Đang lưu...' : 'Lưu lớp' }}
        </button>
      </div>
    </form>
  </div>
}
