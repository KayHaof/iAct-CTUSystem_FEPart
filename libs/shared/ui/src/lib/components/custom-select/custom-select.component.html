<div class="select-shell" [class.select-shell-disabled]="disabled">
  @if (label) {
    <label class="select-label" [attr.for]="id">{{ label }}</label>
  }

  <div class="select-control" [class.select-control-open]="isOpen()" [class.select-control-disabled]="disabled">
    <button
      type="button"
      class="select-trigger"
      [id]="id"
      [disabled]="disabled"
      [attr.aria-haspopup]="'listbox'"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-label]="label || placeholder"
      (click)="toggle()"
      (keydown)="onTriggerKeydown($event)"
    >
      <span class="select-trigger-left">
        <i class="select-trigger-icon" [ngClass]="['bi', icon]"></i>
        <span class="select-trigger-text">
          <span class="select-trigger-title" [class.is-placeholder]="!selectedOption()">
            {{ displayLabel() }}
          </span>
        </span>
      </span>
      <i class="select-trigger-chevron bi bi-chevron-down" [class.is-open]="isOpen()"></i>
    </button>

    @if (isOpen()) {
      <div class="select-menu" role="listbox" [attr.aria-labelledby]="id">
        @for (option of options; track option.label + '-' + option.value) {
          <button
            type="button"
            class="select-option"
            role="option"
            [attr.aria-selected]="isSelected(option)"
            [class.is-active]="isSelected(option)"
            [class.is-disabled]="option.disabled"
            [disabled]="option.disabled"
            (click)="select(option)"
            (keydown)="onOptionKeydown($event, option)"
          >
            <span class="select-option-main">
              @if (option.icon) {
                <i class="select-option-icon" [ngClass]="['bi', option.icon]"></i>
              }
              <span class="select-option-text">
                <span class="select-option-title">{{ option.label }}</span>
                @if (option.description) {
                  <span class="select-option-description">{{ option.description }}</span>
                }
              </span>
            </span>
            @if (isSelected(option)) {
              <i class="bi bi-check2 select-option-check"></i>
            }
          </button>
        }
      </div>
    }
  </div>

  @if (helperText) {
    <p class="select-helper">{{ helperText }}</p>
  }
</div>
