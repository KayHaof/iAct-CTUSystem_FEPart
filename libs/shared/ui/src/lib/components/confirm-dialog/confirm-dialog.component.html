@if (dialogState(); as state) {
  <div
    class="confirm-overlay"
    role="presentation"
    tabindex="-1"
    (click)="onOverlayClick($event)"
    (keydown.escape)="onCancel()"
  >
    <section
      [class]="'confirm-card confirm-card--' + (state.type || 'info')"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="titleId"
      [attr.aria-describedby]="state.message ? messageId : null"
      tabindex="-1"
    >
      <div class="confirm-bar" aria-hidden="true"></div>

      <header class="confirm-header">
        <div class="confirm-icon" aria-hidden="true">
          @switch (state.type || 'info') {
            @case ('success') {
              <i class="bi bi-check-lg"></i>
            }
            @case ('warning') {
              <i class="bi bi-exclamation-lg"></i>
            }
            @case ('danger') {
              <i class="bi bi-exclamation-triangle-fill"></i>
            }
            @default {
              <i class="bi bi-info-lg"></i>
            }
          }
        </div>

        <div class="confirm-heading">
          <span class="confirm-eyebrow">{{ typeLabel(state.type || 'info') }}</span>
          <h2 class="confirm-title" [id]="titleId">{{ state.title }}</h2>
        </div>
      </header>

      @if (state.message) {
        <div class="confirm-body">
          <p class="confirm-message" [id]="messageId">{{ state.message }}</p>
        </div>
      }

      <footer class="confirm-actions">
        <button type="button" class="confirm-button confirm-button--cancel" (click)="onCancel()">
          {{ state.cancelText || 'Hủy' }}
        </button>
        <button
          type="button"
          [class]="'confirm-button confirm-button--confirm confirm-button--' + (state.type || 'info')"
          (click)="onConfirm()"
        >
          {{ state.confirmText || 'Xác nhận' }}
        </button>
      </footer>
    </section>
  </div>
}
