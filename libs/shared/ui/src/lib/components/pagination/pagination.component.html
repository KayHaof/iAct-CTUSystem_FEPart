<div class="pagination-wrapper" [class.has-open-menu]="isDropdownOpen()">
  <div class="pagination-summary">
    <p class="info-text" aria-live="polite">
      <span class="info-label">Đang xem</span>
      <strong class="info-highlight">{{ startItem() }}–{{ endItem() }}</strong>
      <span class="info-label">trên</span>
      <strong class="info-highlight">{{ totalItems() }}</strong>
      <span class="info-label">mục</span>
    </p>
  </div>

  <div class="pagination-controls">
    @if (availablePageSizes().length > 1) {
      <div class="page-size-dropdown">
        <span class="page-size-label">Số mục/trang</span>
        <button
          type="button"
          class="page-size-trigger"
          cdkOverlayOrigin
          #pageSizeTrigger="cdkOverlayOrigin"
          aria-haspopup="listbox"
          aria-label="Chọn số mục mỗi trang"
          [attr.aria-expanded]="isDropdownOpen()"
          [attr.aria-controls]="pageSizeMenuId"
          (click)="togglePageSizeDropdown()"
          (blur)="onBlur()"
          (keydown.escape)="closePageSizeDropdown()"
        >
          <span>{{ pageSize() }}</span>
          <span class="page-size-unit">mục</span>
          <i class="bi bi-chevron-down dropdown-icon" aria-hidden="true"></i>
        </button>

        <ng-template
          cdkConnectedOverlay
          [cdkConnectedOverlayOrigin]="pageSizeTrigger"
          [cdkConnectedOverlayOpen]="isDropdownOpen()"
          [cdkConnectedOverlayPositions]="pageSizePositions"
          [cdkConnectedOverlayPush]="true"
          (detach)="closePageSizeDropdown()"
        >
          <div
            class="page-size-menu"
            [id]="pageSizeMenuId"
            role="listbox"
            aria-label="Số mục mỗi trang"
          >
            @for (size of availablePageSizes(); track size) {
              <button
                type="button"
                class="page-size-option"
                role="option"
                [class.active]="size === pageSize()"
                [attr.aria-selected]="size === pageSize()"
                (click)="selectPageSize(size)"
              >
                <span>{{ size }} mục</span>
                @if (size === pageSize()) {
                  <i class="bi bi-check-lg" aria-hidden="true"></i>
                }
              </button>
            }
          </div>
        </ng-template>
      </div>
    }

    @if (totalPages() > 1) {
      <div class="pagination-nav">
        <nav class="nav-container" aria-label="Phân trang">
          <button
            type="button"
            class="nav-button nav-prev"
            aria-label="Trang trước"
            title="Trang trước"
            [disabled]="displayCurrentPage() === 1"
            (click)="prevPage()"
          >
            <i class="bi bi-chevron-left" aria-hidden="true"></i>
            <span class="nav-label">Trước</span>
          </button>

          @for (page of pages(); track $index) {
            @if (page === '...') {
              <span class="nav-ellipsis" aria-hidden="true">…</span>
            } @else {
              <button
                type="button"
                class="nav-page"
                [class.active]="page === displayCurrentPage()"
                [attr.aria-current]="page === displayCurrentPage() ? 'page' : null"
                [attr.aria-label]="'Trang ' + page"
                (click)="onPageClick(page)"
              >
                {{ page }}
              </button>
            }
          }

          <button
            type="button"
            class="nav-button nav-next"
            aria-label="Trang sau"
            title="Trang sau"
            [disabled]="displayCurrentPage() === totalPages()"
            (click)="nextPage()"
          >
            <span class="nav-label">Sau</span>
            <i class="bi bi-chevron-right" aria-hidden="true"></i>
          </button>
        </nav>
      </div>
    }
  </div>
</div>
