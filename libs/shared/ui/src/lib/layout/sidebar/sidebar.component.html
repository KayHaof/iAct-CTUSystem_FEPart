<aside
  class="sidebar-container"
  [class.is-mobile-open]="isMobileOpen()"
  [class.is-mobile]="isMobile()"
  [class.is-light]="theme === 'light'"
  [class.is-dark]="theme === 'dark'"
  [attr.aria-hidden]="isMobile() ? !isMobileOpen() : null"
  aria-label="Thanh điều hướng chính"
>
  <a
    class="sidebar-logo"
    [routerLink]="homeLink"
    (click)="handleNavigation($event)"
    aria-label="Về trang tổng quan"
    title="Về trang tổng quan"
  >
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-copy">
      <span class="logo-text">iAct CTU</span>
      <span class="logo-subtitle">Quản lý hoạt động</span>
    </span>
  </a>

  <nav class="sidebar-nav" aria-label="Danh mục điều hướng">
    @for (item of menuItems; track item.link) {
      <a
        class="nav-item"
        [routerLink]="item.link"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        ariaCurrentWhenActive="page"
        [title]="item.label"
        (click)="handleNavigation($event)"
      >
        <i [class]="item.icon" class="nav-icon" aria-hidden="true"></i>
        <span class="nav-text">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <button
      class="logout-btn"
      type="button"
      (click)="logout()"
      aria-label="Đăng xuất"
      title="Đăng xuất"
    >
      <i class="bi bi-box-arrow-left nav-icon" aria-hidden="true"></i>
      <span class="nav-text">Đăng xuất</span>
    </button>
  </div>
</aside>
